database_key: ga4_export_database
schema_key: ga4_export_schema

dbt_versions: ">=1.3.0 <3.0.0"

public_models: [
  "ga4_export__events_report",
  "ga4_export__traffic_acquisition_session_source_medium_report",
  "ga4_export__user_acquisition_first_user_source_medium_report",
  "ga4_export__sessions_enhanced"
]

supported_vars:
  key_events:
    type: list
    description: "Business-critical key events that will be included in `ga4_export__conversions_report`, `ga4_export__traffic_acquisition_session_source_medium_report`, and `ga4_export__user_acquisition_first_user_source_medium_report`"
    display_name: "Key Events"

  ga4_export_date_start:
    type: date
    value: "2024-01-01"
    description: "Start date for the window of data to transform (YYYY-MM-DD format)"
    display_name: "Date Range Start"

  lookback_window:
    type: integer
    value: 7
    description: "Number of days into the past that incremental models will look back to capture late-arriving records on incremental runs"
    display_name: "Incremental Run Lookback Window (Days)"

